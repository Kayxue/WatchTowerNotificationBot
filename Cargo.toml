[package]
name = "WatchtowerNotificationBot"
version = "0.1.0"
edition = "2024"

[dependencies]
xitca-web = { version = "*", features = ["logger", "json", "codegen"] }
tokio = { version = "1", features = ["full"] }
dotenv = "0.15.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
twilight-http = { version = "0.16", default-features = false, features = ["rustls-ring", "rustls-webpki-roots"] }
twilight-model = "0.16"
twilight-gateway = { version = "0.16", default-features = false, features = ["rustls-ring", "rustls-webpki-roots"] }
futures = "0.3"
rand = "0.8"
twilight-util = { version = "0.16", features = ["builder"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-roots"] }